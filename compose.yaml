services:
  postgres:
    image: postgres:17-alpine
    container_name: webxterm-postgres
    environment:
      POSTGRES_USER: webxterm
      POSTGRES_PASSWORD: webxterm
      POSTGRES_DB: webxterm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webxterm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
