# Self-hosted weirdvault: the whole product on one machine.
#
# This is the answer to a security review. Run it on your own network and the
# relay metadata that a hosted deployment would see — which host, when, how
# much — never leaves your infrastructure.
#
#   cp .env.example .env   # then fill in the secrets
#   docker compose -f compose.prod.yaml up -d
#
# Put a TLS terminator in front (Caddy, nginx, a load balancer). Both services
# speak plain HTTP; the browser requires wss:// for the relay on an https page,
# so TLS is not optional in production.
#
# ## Configuration comes from .env
#
# The web container reads the whole file with `env_file`, so the names in .env
# are the names the process reads and nothing renames anything on the way in.
#
# The relay is the deliberate exception, and it is a boundary rather than a
# style: it is the internet-facing process, and the reason it holds no database
# credentials today is that it was never given any. `env_file` here would hand
# it DATABASE_URL, BETTER_AUTH_SECRET and the Stripe keys to save nine lines.
# So it gets an explicit list, interpolated from the same .env — one file, no
# duplication, and a blast radius that stays where it was put.
#
# Two things this trades away, worth knowing rather than discovering:
#
#   - `env_file` cannot supply build args. NEXT_PUBLIC_* is inlined into the
#     browser bundle at build time, so it is passed below as well, and changing
#     it needs `docker compose build web` rather than a restart.
#   - `env_file` has no equivalent of ${VAR:?message}, so a variable you forgot
#     is silently empty instead of a refusal to start. The app says so on screen
#     for the optional ones; the required ones are still checked below.
#
# ## Reverse proxy
#
# The relay publishes a port here so a terminator outside compose can reach it.
# If you would rather serve everything on one origin — one certificate, one
# domain, no second published port — drop `ports` from the relay, route /ws and
# /agent to relay:8080 in your proxy, and set NEXT_PUBLIC_RELAY_URL to
# wss://your-app/ws. Two things to configure there: no idle timeout (nginx
# defaults to 60s and will cut an SSH session sitting at a prompt), and
# proxy_buffering off (or interactive typing arrives in clumps).

name: weirdvault

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-weirdvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-weirdvault}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weirdvault}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published: only the app needs it, and exposing Postgres to the host
    # is the single most common way a self-hosted deployment gets owned.
    expose:
      - "5432"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # A build arg, not an environment variable, and it has to be both:
        # NEXT_PUBLIC_* is inlined into the browser bundle when the image is
        # built, and read again at runtime on the server. env_file covers the
        # second; only this covers the first.
        NEXT_PUBLIC_RELAY_URL: ${NEXT_PUBLIC_RELAY_URL:?set NEXT_PUBLIC_RELAY_URL in .env}
    restart: unless-stopped
    # service_healthy, not service_started: the container migrates before it
    # serves, so it needs Postgres accepting connections rather than merely
    # existing.
    depends_on:
      postgres:
        condition: service_healthy
    # Everything: DATABASE_URL, BETTER_AUTH_*, the three relay secrets, Stripe,
    # GitHub, R2_*, TRUSTED_PROXY_HOPS, AGENT_RELEASE_BASE_URL. Adding a
    # variable to .env is all it takes — no second edit here, which is what used
    # to leave five documented variables reaching the file and never the
    # container.
    #
    # The R2_* four are why this is the web service and not the relay: the
    # bucket credentials belong to the process that authorizes a request before
    # it fetches an object, and the relay never touches a recording.
    env_file:
      - .env
    ports:
      - "${WEB_PORT:-3000}:3000"

  relay:
    build:
      context: .
      dockerfile: apps/relay/Dockerfile
    restart: unless-stopped
    # Listed rather than env_file. See the header: this is the process on the
    # internet, and the four secrets below are all it should ever be able to
    # read. Values still come from .env — compose interpolates them — so there
    # is one file to edit and no copy to keep in step.
    environment:
      RELAY_SECRET: ${RELAY_SECRET:?set RELAY_SECRET in .env}
      RELAY_ADDR: 0.0.0.0:8080
      # Destination allowlist. Add ports only if you genuinely SSH on them —
      # every extra port widens what this relay can be pointed at.
      RELAY_PORTS: ${RELAY_PORTS:-22}
      # RELAY_ALLOW_PRIVATE is deliberately absent. Setting it disables the
      # SSRF guard and turns the relay into an open proxy into whatever network
      # it sits on. Only set it if the relay is meant to reach an internal
      # network AND is not reachable by untrusted users.
      #
      # Transfer accounting. The relay counts bytes in memory and posts batched
      # per-account totals to the control plane; it never touches the database
      # itself, which is the point of routing this through an HTTP endpoint
      # rather than handing Postgres credentials to the internet-facing service.
      # Plain http:// on the compose network — the relay has no TLS stack and
      # refuses an https:// URL rather than appearing to encrypt.
      #
      # Both of these unset is a supported configuration: nothing is counted, no
      # allowance is enforced, and the relay says so at startup.
      RELAY_USAGE_URL: ${RELAY_USAGE_URL:-http://web:3000/api/relay/usage}
      RELAY_USAGE_SECRET: ${RELAY_USAGE_SECRET:-}
      RELAY_USAGE_INTERVAL_SECS: ${RELAY_USAGE_INTERVAL_SECS:-60}
      #
      # Agents. A machine with no public address holds an outbound connection to
      # /agent/control here and the relay pairs a browser to it on demand. The
      # relay cannot authenticate that machine on its own — it has no keys and no
      # database — so it asks the control plane, over the same private network
      # and with the same plain HTTP as the usage reports above.
      #
      # Both unset is a supported configuration and means agents are off. Setting
      # exactly one is a typo, and the relay says so at startup with a warning
      # naming the missing half — from the outside a half-configured relay looks
      # identical to one where agents were switched off on purpose.
      #
      # NOTE: agent registration lives in one relay's memory, so a fleet behind a
      # load balancer needs /ws and /agent to land on the same instance. A single
      # relay — which is what this file describes — is unaffected.
      RELAY_AGENT_VERIFY_URL: ${RELAY_AGENT_VERIFY_URL:-http://web:3000/api/agents/verify}
      RELAY_AGENT_SECRET: ${RELAY_AGENT_SECRET:-}
      RUST_LOG: ${RUST_LOG:-weirdvault_relay=info}
    ports:
      - "${RELAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/weirdvault-relay", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # The scheduler. Nothing about this is clever, and that is the point.
  #
  # Audit rows past their retention window, abandoned enrollment tokens, stale
  # rate-limit counters and recording objects no row claims all need removing on
  # a timer. That used to be two node scripts and a paragraph in the README
  # asking an operator to write a crontab line, which meant it had never run
  # anywhere. Now the work is POST /api/cron and this calls it.
  #
  # It holds one secret and one URL. It deliberately does NOT hold DATABASE_URL
  # or the bucket credentials: the web container already has them, and a second
  # container with a copy of R2_SECRET_ACCESS_KEY would be a second place to
  # rotate it and a second thing to compromise.
  #
  # busybox crond and busybox wget, both already in the alpine base image, so
  # there is nothing to install at start and no network needed to boot. If you
  # would rather schedule this elsewhere — a systemd timer, a crontab on the
  # host, Upstash, a GitHub Action — delete this service and POST to the same
  # route with the same header. Nothing about the work is coupled to this.
  cron:
    image: alpine:3.21
    restart: unless-stopped
    depends_on:
      - web
    environment:
      # Blank and the route answers 503 for everybody, including this. Compose
      # refuses to start rather than running a scheduler against an endpoint
      # that will reject it every night in a log nobody reads.
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      # Standard five-field crontab. Default is 04:15 daily: after midnight, so
      # a day's rows have aged out, and not on the hour, where every cron job
      # ever written already is.
      CRON_SCHEDULE: ${CRON_SCHEDULE:-15 4 * * *}
      CRON_URL: ${CRON_URL:-http://web:3000/api/cron}
    # `--post-data=''` makes it a POST with an empty body; the route refuses GET
    # on purpose, so a prefetch or a link preview cannot run the cleanup.
    #
    # The `>> /proc/1/fd/1` is not decoration. busybox crond does not log what a
    # command printed — it tries to *mail* it, and with no sendmail in the image
    # the report is discarded, leaving `docker compose logs cron` showing that a
    # job ran and nothing about what it did. Redirecting to PID 1's stdout is
    # what puts the JSON report where `docker compose logs cron` can show it.
    command:
      - sh
      - -c
      - |
        set -eu
        echo "$$CRON_SCHEDULE wget -q -O - --header=\"authorization: Bearer $$CRON_SECRET\" --post-data='' \"$$CRON_URL\" >> /proc/1/fd/1 2>&1 || echo 'cron: maintenance request failed' >> /proc/1/fd/1" > /etc/crontabs/root
        echo "cron: scheduled '$$CRON_SCHEDULE' against $$CRON_URL"
        exec crond -f -l 8 -L /dev/stdout

volumes:
  pgdata:
