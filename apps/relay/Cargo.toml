[package]
name = "webxterm-relay"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Stateless WebSocket-to-TCP relay for webxterm. Forwards SSH ciphertext it cannot read."

[dependencies]
axum = { version = "0.8", features = ["ws", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "time", "io-util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
subtle = "2"
dashmap = "6"
futures-util = "0.3"
thiserror = "2"
# Nonces and rendezvous tickets. Both are unguessability requirements, so this
# must stay a CSPRNG — `rand::rngs::OsRng`, never `thread_rng` seeded once.
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
