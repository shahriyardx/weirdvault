<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>webxterm — Phase 0 spike</title>
    <link rel="stylesheet" href="vendor/xterm.css" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0e14;
        --panel: #131822;
        --line: #232a38;
        --fg: #c9d1d9;
        --dim: #7d8798;
        --ok: #46d47f;
        --bad: #ff6b6b;
        --accent: #6aa9ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
        display: grid;
        grid-template-columns: 380px 1fr;
        height: 100vh;
      }
      aside {
        background: var(--panel);
        border-right: 1px solid var(--line);
        padding: 20px;
        overflow-y: auto;
      }
      h1 { font-size: 16px; margin: 0 0 4px; }
      .sub { color: var(--dim); font-size: 12px; margin-bottom: 20px; }
      fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 0 0 14px; }
      legend { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding: 0 6px; }
      label { display: block; font-size: 11px; color: var(--dim); margin: 8px 0 3px; }
      input {
        width: 100%; padding: 7px 9px; border-radius: 6px;
        border: 1px solid var(--line); background: #0d1119; color: var(--fg);
        font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      button {
        width: 100%; padding: 9px; margin-top: 10px; border-radius: 6px; cursor: pointer;
        border: 1px solid var(--line); background: #1b2230; color: var(--fg);
        font: 500 13px ui-sans-serif, system-ui, sans-serif;
      }
      button:hover { background: #222b3b; }
      button.primary { background: var(--accent); color: #07101f; border-color: var(--accent); font-weight: 600; }
      button:disabled { opacity: .5; cursor: not-allowed; }
      pre {
        background: #0d1119; border: 1px solid var(--line); border-radius: 6px;
        padding: 9px; font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap; word-break: break-all; margin: 6px 0 0; max-height: 130px; overflow: auto;
      }
      .row { display: grid; grid-template-columns: 1fr 90px; gap: 8px; }
      #log { font: 11px/1.6 ui-monospace, Menlo, monospace; }
      #log div { border-bottom: 1px solid var(--line); padding: 3px 0; }
      .ok { color: var(--ok); }
      .bad { color: var(--bad); }
      .dim { color: var(--dim); }
      main { padding: 10px; min-width: 0; }
      #term { height: 100%; }
    </style>
  </head>
  <body>
    <aside>
      <h1>webxterm — Phase 0</h1>
      <div class="sub">
        Go/WASM SSH client authenticating to stock OpenSSH with a
        non-extractable WebCrypto key.
      </div>

      <fieldset>
        <legend>1 · Key</legend>
        <button id="gen">Generate Ed25519 key in browser</button>
        <label>authorized_keys line</label>
        <pre id="pubkey">—</pre>
        <button id="copy">Copy</button>
        <div id="proof" class="sub" style="margin: 10px 0 0"></div>
      </fieldset>

      <fieldset>
        <legend>2 · Target</legend>
        <div class="row">
          <div><label>Host</label><input id="host" value="127.0.0.1" /></div>
          <div><label>Port</label><input id="port" value="2222" /></div>
        </div>
        <label>User</label>
        <input id="user" value="webxterm" />
        <button id="connect" class="primary" disabled>Connect</button>
        <button id="disconnect" disabled>Disconnect</button>
      </fieldset>

      <fieldset>
        <legend>3 · Trace</legend>
        <div id="log"></div>
      </fieldset>
    </aside>
    <main><div id="term"></div></main>

    <script src="vendor/xterm.js"></script>
    <script src="vendor/addon-fit.js"></script>
    <script src="wasm_exec.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
