# weirdvault — nginx site config
#
#   sudo cp deploy/nginx/vault.weordsoft.co.uk.conf \
#           /etc/nginx/sites-available/vault.weordsoft.co.uk
#   sudo ln -s /etc/nginx/sites-available/vault.weordsoft.co.uk \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# One hostname serves everything: the app, and the relay under /ws and /agent.
# One certificate, one DNS record, and neither service is reachable from
# outside — compose.prod.yaml binds both to 127.0.0.1.
#
# Upstream ports are the *host* side, and must match .env:
#   WEB_PORT=6000     → 127.0.0.1:6000
#   RELAY_PORT=6001   → 127.0.0.1:6001
# The containers listen on 3000 and 8080 internally regardless.
#
# Set in .env to match:
#   BETTER_AUTH_URL=https://vault.weordsoft.co.uk
#   NEXT_PUBLIC_RELAY_URL=wss://vault.weordsoft.co.uk/ws
#   TRUSTED_PROXY_HOPS=1
#   TRUSTED_PROXY_IPS=            # left blank on purpose — see the note below
#
# NEXT_PUBLIC_RELAY_URL is compiled into the browser bundle, so changing it
# needs `docker compose -f compose.prod.yaml build web`, not a restart.

# --------------------------------------------------------------------------
# Cloudflare: recover the real client address
#
# With the orange cloud on, every request arrives from Cloudflare, so
# $remote_addr is a Cloudflare address and X-Forwarded-For is whatever the
# caller sent plus what Cloudflare appended. `real_ip` replaces $remote_addr
# with the address in CF-Connecting-IP, which only Cloudflare can set.
#
# Refresh this list from https://www.cloudflare.com/ips/ — it changes.
# --------------------------------------------------------------------------
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# WebSocket upgrade, keyed off the request. `''` closes rather than upgrades,
# so ordinary requests are unaffected.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name vault.weordsoft.co.uk;

    # Nothing should arrive here: Cloudflare talks to the origin on 443. A
    # request on 80 is either a direct hit on the IP or a misconfiguration, and
    # either way it gets sent to TLS rather than answered in the clear.
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vault.weordsoft.co.uk;

    # A Cloudflare Origin Certificate: free, valid for 15 years, issued from
    # the dashboard (SSL/TLS → Origin Server → Create Certificate). Trusted by
    # Cloudflare and by nothing else, which is exactly right for an origin that
    # only Cloudflare talks to — and it means no certbot and no renewal cron.
    #
    # Set the Cloudflare SSL/TLS mode to **Full (strict)** to go with it.
    #
    # Let's Encrypt instead? Point these at
    # /etc/letsencrypt/live/vault.weordsoft.co.uk/{fullchain,privkey}.pem and
    # add back an ACME challenge location in the port 80 server below.
    ssl_certificate     /etc/ssl/cloudflare/vault.weordsoft.co.uk.pem;
    ssl_certificate_key /etc/ssl/cloudflare/vault.weordsoft.co.uk.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # The app sends its own CSP, HSTS and frame headers from src/proxy.ts.
    # Nothing security-related is set here, so there is one place they are
    # decided and no chance of two answers disagreeing.

    # Recordings are up to 12 MB of ciphertext in a JSON body, and vault blobs
    # grow with the host list. nginx defaults to 1 MB, which would reject a
    # saved recording with a 413 that looks like a bug in the app.
    client_max_body_size 20m;

    # ----------------------------------------------------------------------
    # The relay. Long-lived WebSockets carrying SSH ciphertext.
    # ----------------------------------------------------------------------
    # Anchored with (/|$) deliberately: a bare ^/(ws|agent) also matches
    # /agent-bin/..., which is where the installer downloads binaries from, and
    # would hand those requests to the relay.
    location ~ ^/(ws|agent)(/|$) {
        proxy_pass http://127.0.0.1:6001;   # relay  → RELAY_PORT
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replaced, not appended. real_ip has already set $remote_addr to the
        # true client, so the app receives exactly one entry that nginx wrote
        # and nothing a caller sent survives. This is what makes
        # TRUSTED_PROXY_HOPS=1 correct and TRUSTED_PROXY_IPS unnecessary.
        proxy_set_header X-Forwarded-For   $remote_addr;

        # An SSH session sitting at a prompt sends nothing for minutes. The
        # 60-second default would drop it, and it would look like a weirdvault
        # bug rather than a proxy setting.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Interactive typing must not be held back waiting for a buffer to fill.
        proxy_buffering off;
    }

    # ----------------------------------------------------------------------
    # Everything else: the Next.js app.
    # ----------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:6000;   # web    → WEB_PORT
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 60s;
    }

    # ssh.wasm is ~8 MB and never changes without its URL changing, so it is
    # worth caching hard. Next fingerprints /_next/static itself; this covers
    # the WASM core and the agent binaries the installer downloads.
    location ~ ^/(ssh\.wasm|wasm_exec\.js|agent-bin/) {
        proxy_pass http://127.0.0.1:6000;   # web    → WEB_PORT
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Next sends `Cache-Control: public, max-age=0` for files in public/,
        # and add_header appends rather than replaces — so without hiding the
        # upstream one first, the response carries two Cache-Control headers
        # and the browser obeys whichever it reads first. Verified with curl.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
