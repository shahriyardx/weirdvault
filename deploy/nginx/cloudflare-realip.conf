# Cloudflare: recover the real client address.
#
#   sudo cp deploy/nginx/cloudflare-realip.conf /etc/nginx/conf.d/cloudflare-realip.conf
#
# ── Skip this file if you already have real_ip configured
#
# `real_ip_header` may be declared exactly once. Declaring it twice is not a
# warning, it is "directive is duplicate" and nginx refuses to start — so if
# another file already sets it, do not install this one. (`set_real_ip_from` is
# an array and duplicates are harmless; only the header directive conflicts.)
#
# ── What it does
#
# With Cloudflare's proxy on, every request reaches nginx from a Cloudflare
# address, so $remote_addr is Cloudflare and X-Forwarded-For is whatever the
# caller sent plus what Cloudflare appended. This replaces $remote_addr with the
# address in CF-Connecting-IP, which only Cloudflare can set — which is what
# makes the site config's `X-Forwarded-For $remote_addr` a value the caller
# cannot choose.
#
# Refresh the ranges from https://www.cloudflare.com/ips/ — they change.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
